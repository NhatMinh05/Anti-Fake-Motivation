<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipline OS - System Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/login.css">
  <meta name="theme-color" content="#0E0E0E">
  <link rel="manifest" href="manifest.json">
  <script>
    // INSTANT REDIRECT IF AUTHENTICATED
    if (localStorage.getItem('access_token')) {
      window.location.href = 'index.html';
    }
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>
  <div id="bootSequence" class="terminal">
    <!-- Boot text will be generated via JS -->
  </div>

  <div id="loginFormContainer" class="login-wrapper hidden">
    <div class="glitch-container">
      <h1 class="glitch" data-text="DISCIPLINE OS">DISCIPLINE OS</h1>
    </div>
    <div class="login-box">
      <div class="qr-corner-btn" id="qrLoginBtn" title="Matrix Scan Login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM10 3h4M10 21h4M3 10h18M15 15h6v6h-6z"/></svg>
      </div>

      <div class="box-header">[ SYSTEM AUTHENTICATION ]</div>

      <form id="loginForm">
        <div class="input-group">
          <label>USER ID</label>
          <input type="text" id="username" autocomplete="off" spellcheck="false" required placeholder="Username...">
        </div>
        
        <div class="input-group" style="margin-bottom: 20px;">
          <label>PASSWORD</label>
          <div class="password-wrapper">
            <input type="password" id="password" required placeholder="Password...">
            <button type="button" class="btn-toggle-pass" id="togglePass">[ SHOW ]</button>
          </div>
        </div>

        <button type="submit" class="cyber-btn" id="btnAuth">LOG IN</button>
        
        <div class="forgot-wrapper">
          <a href="#" id="forgotPass">[ FORGOT PASSWORD? ]</a>
        </div>
      </form>

      <div class="social-divider">
        <span>OR LOGIN WITH</span>
      </div>
      <div class="social-logins">
        <button type="button" class="social-btn github" id="githubLoginBtn" onclick="loginWithGithub()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GITHUB
        </button>
        <button type="button" class="social-btn google" onclick="loginWithGoogle()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          GOOGLE
        </button>
      </div>

      <div class="register-wrapper">
        <span class="muted-text">New Operative?</span> 
        <a href="#" id="enrollNew">[ REGISTER ]</a>
      </div>

      <div id="loginMsg" class="login-msg"></div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
